[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-recaptcha-csp"
version = "0.1.1"
description = "Content Security Policy (CSP) nonce support for django-recaptcha"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    { name="horrocksm", email="mikeh_74_@outlook.com" }
]
keywords = ["django", "recaptcha", "csp", "content-security-policy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]

dependencies = [
    "Django>=4.2",
    "django-recaptcha>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourorg/django-recaptcha-csp"
Documentation = "https://github.com/yourorg/django-recaptcha-csp#readme"
Repository = "https://github.com/yourorg/django-recaptcha-csp.git"
Issues = "https://github.com/yourorg/django-recaptcha-csp/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
recaptcha_csp = ["templates/**/*.html"]

[tool.setuptools.packages.find]
where = ["."]
include = ["recaptcha_csp*"]

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py39"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "S",    # bandit security
    "SIM",  # flake8-simplify
    "S",    # bandit security
    "I",    # isort
    # "C4",   # flake8-comprehensions
    # "DJ",   # flake8-django
    # "RUF",  # Ruff-specific rules
    # "T20",  # flake8-print
    # "N",    # pep8-naming
    # "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # use of assert (OK in tests)
    "S106",  # hardcoded password (OK in tests/examples)
    "DJ001",  # nullable CharField should have null=True
    "T201",  # print statement (OK in management commands)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports
"tests/*" = ["S101", "S106", "S311"]  # Allow asserts, hardcoded passwords, and pseudo-random generators in tests
"*/migrations/*" = ["N806", "N999"]  # Allow non-lowercase variables in migrations

[tool.ruff.lint.isort]
known-first-party = ["recaptcha_csp"]
known-third-party = ["django", "cms", "csp"]

[tool.ruff.lint.mccabe]
max-complexity = 10
